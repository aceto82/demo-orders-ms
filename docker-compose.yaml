services:
  ### PostgreSQL DB inventory
  db-inventory:
    container_name: db-inventory
    image: postgres:18.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ms_inventory
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5431:5431"
    expose:
      - 5431
    volumes:
      - inventory-db-data:/var/lib/postgresql
    command:
      - -p 5431
    healthcheck:
      # The image's pg_hba.conf trusts 127.0.0.1, so connect through the container
      # address to make the probe actually exercise the credentials.
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h \"$$(hostname -i)\" -p 5431 -U \"$$POSTGRES_USER\" -d ms_inventory -c 'select 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  ### MySQL DB orders
  db-orders:
    container_name: db-orders
    image: mysql:9.7.2
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ms_orders
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    expose:
      - 3306
    volumes:
      - orders-db-data:/var/lib/mysql
    healthcheck:
      # `mysqladmin ping` exits 0 even on "Access denied" (it only probes the
      # server), so `status` is used: it authenticates and fails on a wrong password.
      test: ["CMD-SHELL", "mysqladmin -h 127.0.0.1 -u root --password=\"$$MYSQL_ROOT_PASSWORD\" status >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  ### PostgreSQL DB products
  db-products:
    container_name: db-products
    image: postgres:18.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ms_products
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    expose:
      - 5432
    volumes:
      - products-db-data:/var/lib/postgresql
    command:
      - -p 5432
    healthcheck:
      # The image's pg_hba.conf trusts 127.0.0.1, so connect through the container
      # address to make the probe actually exercise the credentials.
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h \"$$(hostname -i)\" -p 5432 -U \"$$POSTGRES_USER\" -d ms_products -c 'select 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  ### PostgreSQL DB Keycloak
  db-keycloak:
    container_name: db-keycloak
    image: postgres:18.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_keycloak
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5433"
    expose:
      - 5433
    volumes:
      - keycloak-db-data:/var/lib/postgresql
    command:
      - -p 5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5433 -U \"$$POSTGRES_USER\" -d db_keycloak"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  ### Keycloak
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.8.0
    command:
      - "start-dev"
    ports:
      - "8181:8181"
    expose:
      - 8181
    depends_on:
      - db-keycloak
    environment:
      DB_VENDOR: POSTGRES
      DB_ADDR: db-keycloak
      DB_DATABASE: db_keycloak
      DB_PORT: 5433
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8181
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      # The image has no HTTP client (no curl/wget), so probe /health/ready on the
      # management port (9000) over bash's /dev/tcp. HTTP/1.0 closes the connection
      # after the response, so grep sees EOF.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  ### Zookeeper
  zookeeper:
    container_name: zookeeper
    image: confluentinc/cp-zookeeper:7.9.10
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  ### Kafka
  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:7.9.10
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  ### Zipkin
  zipkin:
    container_name: zipkin
    image: openzipkin/zipkin:3.6.1
    ports:
      - "9411:9411"

  ### Prometheus
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.15.0
    network_mode: host
    volumes:
      - ./files/prometheus.yml:/etc/prometheus/prometheus.yml

  ### Grafana
  grafana:
    container_name: grafana
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    volumes:
      - ./files/grafana:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
    depends_on:
      - prometheus

volumes:
  orders-db-data:
  inventory-db-data:
  products-db-data:
  keycloak-db-data:
