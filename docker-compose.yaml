services:
  ### PostgreSQL DB inventory
  db-inventory:
    container_name: db-inventory
    image: postgres:18.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ms_inventory
      POSTGRES_USER: aceto82
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5431:5431"
    expose:
      - 5431
    command:
      - -p 5431

  ### MySQL DB orders
  db-orders:
    container_name: db-orders
    image: mysql:9.7.2
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ms_orders
      MYSQL_USER: aceto82
      MYSQL_PASSWORD: 12345678
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    expose:
      - 3306

  ### PostgreSQL DB products
  db-products:
    container_name: db-products
    image: postgres:18.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ms_products
      POSTGRES_USER: aceto82
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5432:5432"
    expose:
      - 5432
    command:
      - -p 5432

  ### PostgreSQL DB Keycloak
  db-keycloak:
    container_name: db-keycloak
    image: postgres:18.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_keycloak
      POSTGRES_USER: aceto82
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5433:5433"
    expose:
      - 5433
    command:
      - -p 5433

  ### Keycloak
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.8.0
    command:
      - "start-dev"
    ports:
      - "8181:8181"
    expose:
      - 8181
    depends_on:
      - db-keycloak
    environment:
      DB_VENDOR: POSTGRES
      DB_ADDR: db-keycloak
      DB_DATABASE: db_keycloak
      DB_PORT: 5433
      DB_USER: aceto82
      DB_PASSWORD: 12345678
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8181
