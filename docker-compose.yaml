services:
  ### PosgreSQL DB inventory
  db-inventory:
    container_name: db-inventory
    image: postgres:18.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ms_inventory
      POSTGRES_USER: aceto82
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5431:5431"
    expose:
      - 5431
    command:
      - -p 5431

  ### MySQL DB orders
  db-orders:
    container_name: db-orders
    image: mysql:9.7.2
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ms_orders
      MYSQL_USER: aceto82
      MYSQL_PASSWORD: 12345678
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    expose:
      - 3306

  ### PosgreSQL DB products
  db-products:
    container_name: db-products
    image: postgres:18.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ms_products
      POSTGRES_USER: aceto82
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5432:5432"
    expose:
      - 5432
    command:
      - -p 5432

