spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: inventory-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/inventory/**
            - id: orders-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/order/**
            - id: products-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/product/**



server:
  port: 8080
