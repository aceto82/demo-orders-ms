spring:
  security:
    oauth2:
      client:
        provider:
          keycloak:
            authorization-uri: http://localhost:8181/realms/demo-orders-serv-realm/protocol/openid-connect/auth
            token-uri: http://localhost:8181/realms/demo-orders-serv-realm/protocol/openid-connect/token
            user-info-uri: http://localhost:8181/realms/demo-orders-serv-realm/protocol/openid-connect/userinfo
            jwk-set-uri: http://localhost:8181/realms/demo-orders-serv-realm/protocol/openid-connect/certs
            user-name-attribute: preferred_username
        registration:
          keycloak:
            provider: keycloak
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8181/realms/demo-orders-serv-realm/protocol/openid-connect/certs
