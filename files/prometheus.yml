global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: 'products-service'
    metrics_path: '/actuator/products/prometheus'
    static_configs:
      - targets: ['localhost:8080']
        labels:
          application: 'Product Service'
  - job_name: 'orders-service'
    metrics_path: '/actuator/orders/prometheus'
    static_configs:
      - targets: [ 'localhost:8080' ]
        labels:
          application: 'Order Service'
  - job_name: 'inventory-service'
    metrics_path: '/actuator/inventory/prometheus'
    static_configs:
      - targets: [ 'localhost:8080' ]
        labels:
          application: 'Inventory Service'
  - job_name: 'discovery-server'
    metrics_path: '/actuator/discovery/prometheus'
    static_configs:
      - targets: [ 'localhost:8080' ]
        labels:
          application: 'Discovery Server'
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'localhost:8080' ]
        labels:
          application: 'API Gateway'
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]